# devfile.yaml — 只负责编排开发环境（容器 / 端口 / 环境变量 / 持久卷 / 启动命令）
# 业务代码和数据库连接逻辑仍在 ws_server.py 里，devfile 不干涉。
schemaVersion: 2.2.2
metadata:
  name: dating-ws-backend
  version: 1.0.0

components:
  # ---------- 1. WebSocket 后端容器 ----------
  - name: backend
    container:
      image: python:3.12
      mountSources: true
      memoryLimit: 512Mi
      # 数据库配置注入：代码用 os.getenv 读取，不硬编码
      env:
        - name: DB_TYPE
          value: "sqlite"
        # SQLite 文件必须落在持久卷目录，容器重建才不丢数据
        - name: DB_PATH
          value: "/projects/data/data.db"
        - name: PORT
          value: "8000"
        # 登录 token 有效期（秒），默认 7 天
        - name: TOKEN_TTL
          value: "604800"
        # 注意：SECRET_KEY 故意不写在这里。devfile 的 env 只支持明文 value，
        # 真密钥写进文件就等于提交进仓库。
        # 本地开发：留空即可，ws_server.py 会在 DB_PATH 同目录生成 secret.key 复用，
        #           因为 db-data 卷是持久的，容器重建不会把所有人踢下线。
        # 正式部署：用集群里的 Secret 注入，别落到 devfile/镜像里：
        #   kubectl create secret generic dating-secret --from-literal=SECRET_KEY=$(openssl rand -hex 32)
        # 然后在 backend 组件上改用 secretKeyRef（devfile 原生 env 不支持引用 Secret，
        # 需要把 backend 换成 kubernetes 组件、或交由部署层的 Deployment 注入）
      volumeMounts:
        - name: db-data
          path: /projects/data
      endpoints:
        - name: ws
          targetPort: 8000
          exposure: public   # DevWorkspace 会生成对外路由/Ingress

  # ---------- 2. 持久卷（devfile 原生写法：operator 自动创建 PVC） ----------
  - name: db-data
    volume:
      sizeHint: 512Mi

  # ============================================================
  # 方案B：升级成独立数据库服务时，取消下面注释，
  # 并把上面 backend 的 DB_TYPE 改成 mysql、补 DB_HOST=mysql。
  # 组件名即 hostname，所以后端连库直接写 host: mysql
  # ============================================================
  # - name: mysql
  #   container:
  #     image: mysql:8.0
  #     memoryLimit: 1Gi
  #     env:
  #       - name: MYSQL_ROOT_PASSWORD
  #         value: "123456"
  #       - name: MYSQL_DATABASE
  #         value: "dating"
  #     endpoints:
  #       - name: mysql
  #         targetPort: 3306
  #         exposure: internal
  #     volumeMounts:
  #       - name: mysql-data
  #         path: /var/lib/mysql
  # - name: mysql-data
  #   volume:
  #     sizeHint: 2Gi

  # 若要复用集群里已存在的 PVC（而不是让 operator 新建），用 kubernetes 组件：
  # - name: existing-pvc
  #   kubernetes:
  #     deployByDefault: true
  #     inlined: |
  #       kind: PersistentVolumeClaim
  #       apiVersion: v1
  #       metadata:
  #         name: my-project-pvc
  #       spec:
  #         accessModes: [ReadWriteOnce]
  #         resources:
  #           requests:
  #             storage: 1Gi

commands:
  - id: install-deps
    exec:
      label: "安装 Python 依赖"
      component: backend
      commandLine: "pip install -r requirements.txt"
      workingDir: ${PROJECT_SOURCE}
  - id: run-ws
    exec:
      label: "启动 WebSocket 后端"
      component: backend
      commandLine: "python ws_server.py"
      workingDir: ${PROJECT_SOURCE}
  - id: reset-db
    exec:
      label: "清空数据库（调试用）"
      component: backend
      commandLine: "rm -f /projects/data/data.db && python ws_server.py"
      workingDir: ${PROJECT_SOURCE}

events:
  postStart:
    - install-deps
    - run-ws
