<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遇见 - 交友平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", system-ui, sans-serif;
        }
        body {
            background: #f5f7fa;
            color: #333;
        }
        /* 登录注册页 */
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .auth-card {
            background: white;
            padding: 40px 36px;
            border-radius: 16px;
            width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .auth-card h2 {
            text-align: center;
            margin-bottom: 28px;
            color: #333;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #666;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #667eea;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .switch-auth {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #666;
        }
        .switch-auth span {
            color: #667eea;
            cursor: pointer;
        }
        /* 主应用 */
        .app-page {
            display: none;
            max-width: 720px;
            margin: 0 auto;
            min-height: 100vh;
            background: white;
            position: relative;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 720px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }
        .nav-item {
            flex: 1;
            text-align: center;
            font-size: 13px;
            color: #999;
            cursor: pointer;
        }
        .nav-item.active {
            color: #667eea;
        }
        .page-content {
            padding: 20px;
            padding-bottom: 80px;
        }
        .page-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        /* 用户卡片 */
        .user-card {
            display: flex;
            align-items: center;
            padding: 14px;
            border-radius: 12px;
            background: #f8f9fc;
            margin-bottom: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .user-card:hover {
            background: #eef0f8;
        }
        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 500;
            margin-right: 14px;
            flex-shrink: 0;
            overflow: hidden;
        }
        .avatar img, .msg-avatar img {
            width: 100%;
            height: 100%;
            border-radius: inherit;
            object-fit: cover;
        }
        .msg-avatar { overflow: hidden; }
        .avatar-picker {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .avatar-picker .avatar-preview {
            margin-right: 0;
        }
        .avatar-options {
            flex: 1;
        }
        .emoji-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }
        .emoji-row span {
            font-size: 20px;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 6px;
            line-height: 1;
        }
        .emoji-row span:hover { background: #e6e9f5; }
        .upload-btn {
            display: inline-block;
            font-size: 13px;
            color: #667eea;
            border: 1px solid #667eea;
            border-radius: 6px;
            padding: 4px 10px;
            cursor: pointer;
        }
        .user-info {
            flex: 1;
            overflow: hidden;
        }
        .user-nick {
            font-weight: 500;
            font-size: 16px;
            margin-bottom: 4px;
        }
        .user-bio {
            font-size: 13px;
            color: #888;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .btn-small {
            padding: 6px 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }
        /* 聊天页【修复重点】 */
        .chat-page {
            display: none;
            height: 100vh;
            flex-direction: column;
            max-width: 720px;
            margin: 0 auto;
            background: white;
        }
        .chat-header {
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            background: #f8f9fc;
            position: relative;
        }
        .chat-back {
            cursor: pointer;
            color: #666;
            font-size: 20px;
        }
        .chat-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }
        .chat-title .chat-nick {
            font-size: 16px;
            font-weight: 500;
        }
        .chat-title .chat-status {
            font-size: 12px;
            color: #999;
        }
        .chat-title .chat-status.on { color: #67c23a; }
        .chat-title .chat-status.off { color: #bbb; }
        .mode-tip {
            font-size: 12px;
            margin: -14px 0 16px;
            color: #999;
        }
        .mode-tip.on { color: #67c23a; }
        .mode-tip.off { color: #e6a23c; }
        .nav-badge {
            display: none;
            min-width: 16px;
            height: 16px;
            line-height: 16px;
            padding: 0 4px;
            margin-left: 4px;
            background: #f56c6c;
            color: white;
            font-size: 11px;
            border-radius: 8px;
            vertical-align: top;
        }
        .chat-messages {
            flex: 1;
            min-height: 0;  /* 关键修复！防止挤压 */
            padding: 16px;
            overflow-y: auto;
            background: #ededed;
        }
        .chat-input-bar {
            flex-shrink: 0; /* 输入框区域固定不压缩 */
            padding: 12px 16px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            background: white;
        }
        .chat-input-bar input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            outline: none;
        }
        .btn-send {
            padding: 0 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        .msg-time {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin: 12px 0;
        }
        .msg-item {
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .msg-item.mine {
            flex-direction: row-reverse;
        }
        .msg-avatar {
            width: 38px;
            height: 38px;
            border-radius: 6px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 500;
            flex-shrink: 0;
        }
        .msg-item.other .msg-avatar {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }
        .msg-item.mine .msg-avatar {
            background: linear-gradient(135deg, #5a9bff, #667eea);
        }
        .msg-bubble-wrap {
            display: flex;
            flex-direction: column;
            max-width: 65%;
        }
        .msg-item.mine .msg-bubble-wrap {
            align-items: flex-end;
        }
        .msg-bubble {
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-all;
            white-space: pre-wrap;
        }
        .msg-item.other .msg-bubble {
            background: white;
            color: #1a1a1a;
            border-top-left-radius: 2px;
        }
        .msg-item.mine .msg-bubble {
            background: #95ec69;
            color: #1a1a1a;
            border-top-right-radius: 2px;
        }
        .msg-bubble.typing { color: #999; }
        .typing .dots i {
            font-style: normal;
            animation: blink 1.2s infinite;
        }
        .typing .dots i:nth-child(2) { animation-delay: 0.2s; }
        .typing .dots i:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%,60%,100% { opacity: 0.2; } 30% { opacity: 1; } }
        .emoji-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 10px 12px;
            background: #f8f9fc;
            border-top: 1px solid #eee;
            max-height: 150px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .emoji-panel span {
            font-size: 24px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            line-height: 1;
        }
        .emoji-panel span:hover { background: #e6e9f5; }
        .chat-tool {
            font-size: 24px;
            cursor: pointer;
            align-self: center;
            line-height: 1;
        }
        /* 个人中心 */
        .profile-header {
            text-align: center;
            padding: 30px 0;
        }
        .profile-header .avatar {
            width: 80px;
            height: 80px;
            font-size: 32px;
            margin: 0 auto 16px;
        }
        .profile-item {
            padding: 14px 0;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
        }
        .profile-label {
            color: #888;
            font-size: 14px;
        }
        .btn-logout {
            width: 100%;
            padding: 12px;
            background: #ff5252;
            color: white;
            border: none;
            border-radius: 8px;
            margin-top: 30px;
            cursor: pointer;
        }
        .empty-tip {
            text-align: center;
            color: #aaa;
            padding: 60px 0;
            font-size: 14px;
        }
        .hidden {
            display: none !important;
        }
        /* 消息已读状态：✓ 已发送 / ✓✓ 已读 */
        .msg-status {
            font-size: 11px;
            color: #b7bcc7;
            margin-top: 2px;
            line-height: 1;
            user-select: none;
        }
        .msg-status.read {
            color: #4a90e2;
        }
        /* 广场好友按钮的三种态 */
        .btn-friend {
            padding: 6px 14px;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            background: #667eea;
            color: white;
            white-space: nowrap;
        }
        .btn-friend.is-friend { background: #e8f0d8; color: #67c23a; }
        .btn-friend.is-pending { background: #f0f0f0; color: #999; cursor: default; }
        .btn-friend.is-incoming { background: #e6f0ff; color: #4a90e2; }
        .btn-friend:disabled { opacity: .7; cursor: default; }
        /* 好友申请区 */
        .section-title {
            font-size: 15px;
            font-weight: 600;
            margin: 6px 0 12px;
            color: #555;
        }
        .req-card {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            border-radius: 12px;
            background: #fff7f0;
            margin-bottom: 10px;
        }
        .req-actions {
            display: flex;
            gap: 8px;
        }
        .btn-accept {
            padding: 6px 14px;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            background: #67c23a;
            color: white;
        }
        .btn-reject {
            padding: 6px 14px;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            background: #f0f0f0;
            color: #999;
        }
        /* 个人中心换头像 */
        .avatar-edit {
            margin-top: 12px;
        }
        .avatar-edit .emoji-row {
            justify-content: center;
        }
        /* ===== 兴趣标签选择器 ===== */
        .tag-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }
        .tag-chip {
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 13px;
            cursor: pointer;
            background: #f0f2f8;
            color: #666;
            user-select: none;
        }
        .tag-chip:hover { background: #e3e7f3; }
        .tag-chip.on { background: #667eea; color: #fff; }
        .tag-input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .tag-input-row input {
            flex: 1;
            min-width: 0;
            padding: 8px 10px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            font-size: 13px;
        }
        .tag-mini {
            display: inline-block;
            padding: 2px 10px;
            margin: 0 6px 6px 0;
            border-radius: 12px;
            background: #eef1ff;
            color: #5a6cff;
            font-size: 12px;
        }
        .tag-mini.empty { background: transparent; color: #bbb; }
        .nick-meta {
            font-size: 12px;
            color: #999;
            font-weight: 400;
            margin-left: 8px;
        }
        /* ===== 聊天媒体消息（图片 / 短视频）===== */
        .msg-avatar { cursor: pointer; }
        .msg-bubble.media { padding: 4px; background: transparent; }
        .msg-media {
            display: block;
            max-width: 220px;
            border-radius: 8px;
            overflow: hidden;
            background: #111;
        }
        .msg-media img { display: block; max-width: 100%; max-height: 260px; cursor: zoom-in; }
        .msg-media video { display: block; max-width: 100%; max-height: 260px; background: #111; }
        .media-viewer {
            position: fixed;
            left: 0; top: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, .92);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }
        .media-viewer img, .media-viewer video {
            max-width: 100%;
            max-height: 100%;
            border-radius: 6px;
        }
        /* 聊天顶栏头像：点开对方主页 */
        .chat-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            flex-shrink: 0;
            margin-left: auto;    /* 顶栏居中标题不占位，头像靠最右 */
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }
        .chat-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
        /* ===== 用户主页 / 资料编辑弹窗 ===== */
        .modal-mask {
            position: fixed;
            left: 0; top: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, .45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 16px;
        }
        .modal-card {
            width: 100%;
            max-width: 360px;
            max-height: 88vh;
            overflow-y: auto;
            background: #fff;
            border-radius: 14px;
            position: relative;
        }
        .modal-close {
            position: absolute;
            right: 12px;
            top: 6px;
            font-size: 24px;
            line-height: 1;
            color: #fff;
            cursor: pointer;
            z-index: 2;
            text-shadow: 0 0 6px rgba(0, 0, 0, .55);
        }
        .pm-cover {
            height: 130px;
            border-radius: 14px 14px 0 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            background-size: cover;
            background-position: center;
        }
        .pm-body { padding: 0 18px 18px; }
        .pm-avatar {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: 3px solid #fff;
            overflow: hidden;
            margin-top: -42px;
            background: #eee;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }
        .pm-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .pm-name { font-size: 19px; font-weight: 600; margin: 10px 0 2px; }
        .pm-self {
            font-size: 11px;
            font-weight: 400;
            color: #667eea;
            background: #eef1ff;
            border-radius: 8px;
            padding: 2px 8px;
            margin-left: 8px;
            vertical-align: middle;
        }
        .pm-meta { font-size: 13px; color: #888; margin-bottom: 10px; }
        .pm-bio {
            font-size: 14px;
            color: #444;
            line-height: 1.5;
            padding: 10px 0;
            border-top: 1px dashed #eee;
            word-break: break-all;
        }
        .pm-block-title { font-size: 13px; color: #999; margin: 6px 0 6px; }
        .pm-actions { display: flex; gap: 10px; margin-top: 16px; }
        .pm-actions button { flex: 1; }
        .pe-head { padding: 16px 18px 0; font-size: 17px; font-weight: 600; }
        .pe-body { padding: 12px 18px 18px; }
        .pe-row { margin-bottom: 14px; }
        .pe-row > label {
            display: block;
            font-size: 13px;
            color: #888;
            margin-bottom: 6px;
        }
        .pe-row input[type=text], .pe-row input[type=number], .pe-row textarea, .pe-row select {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .pe-cover {
            height: 90px;
            border-radius: 10px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            background-size: cover;
            background-position: center;
        }
        .pe-avatar-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .pe-avatar-row .avatar { margin-right: 0; width: 56px; height: 56px; font-size: 24px; }
        .upload-btn.mini { margin-right: 6px; }
        /* 个人中心封面 */
        .profile-cover {
            height: 120px;
            border-radius: 12px;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea, #764ba2);
            background-size: cover;
            background-position: center;
        }
        .pi-tags {
            max-width: 70%;
            text-align: right;
        }
    </style>
</head>
<body>

<!-- 登录注册页 -->
<div class="auth-page" id="authPage">
    <div class="auth-card">
        <h2 id="authTitle">登录账号</h2>
        <div id="loginForm">
            <div class="form-group">
                <label>账号</label>
                <input type="text" id="loginUsername" placeholder="请输入账号">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码">
            </div>
            <button class="btn-primary" onclick="handleLogin()">登录</button>
            <div class="switch-auth">
                还没有账号？<span onclick="switchToRegister()">立即注册</span>
            </div>
        </div>

        <div id="registerForm" class="hidden">
            <div class="form-group">
                <label>账号</label>
                <input type="text" id="regUsername" placeholder="设置登录账号">
            </div>
            <div class="form-group">
                <label>昵称</label>
                <input type="text" id="regNickname" placeholder="设置你的昵称">
            </div>
            <div class="form-group">
                <label>性别</label>
                <select id="regGender">
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
            </div>
            <div class="form-group">
                <label>年龄</label>
                <input type="number" id="regAge" min="0" max="120" placeholder="选填，例如 25">
            </div>
            <div class="form-group">
                <label>个性签名</label>
                <textarea id="regBio" rows="2" placeholder="一句话介绍自己"></textarea>
            </div>
            <div class="form-group">
                <label>兴趣爱好（可多选）</label>
                <div class="tag-wrap" id="regInterestRow"></div>
                <div class="tag-input-row">
                    <input type="text" id="regInterestInput" maxlength="24" placeholder="自定义兴趣，回车添加"
                           onkeydown="if(event.key==='Enter'){event.preventDefault();addInterest('reg')}">
                    <span class="upload-btn" onclick="addInterest('reg')">添加</span>
                </div>
            </div>
            <div class="form-group">
                <label>头像</label>
                <div class="avatar-picker">
                    <div class="avatar avatar-preview" id="regAvatarPreview">?</div>
                    <div class="avatar-options">
                        <div class="emoji-row" id="emojiAvatarRow"></div>
                        <label class="upload-btn">上传图片
                            <input type="file" id="regAvatarFile" accept="image/*" onchange="handleAvatarUpload(event)" hidden>
                        </label>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="regPassword" placeholder="设置登录密码">
            </div>
            <div class="form-group">
                <label>确认密码</label>
