<script>
    // 安全读取本地存储
    function safeGet(key) {
        try {
            const val = localStorage.getItem(key);
            return val ? JSON.parse(val) : null;
        } catch(e) {
            return null;
        }
    }
    function safeSet(key, val) {
        try {
            localStorage.setItem(key, JSON.stringify(val));
        } catch(e) {}
    }

    // 初始化示例用户
    function initDemoUsers() {
        if (!safeGet('users')) {
            const demoUsers = [
                {username: 'xiaoyu', password: '123456', nickname: '小鱼', gender: '女', bio: '喜欢旅行和摄影', avatar: '🐟', age: 24, interests: ['旅行', '摄影', '咖啡']},
                {username: 'chenchen', password: '123456', nickname: '晨晨', gender: '男', bio: '程序员，爱健身', avatar: '😎', age: 28, interests: ['健身', '编程', '篮球']},
                {username: 'linlin', password: '123456', nickname: '林林', gender: '女', bio: '咖啡重度爱好者', avatar: '☕', age: 26, interests: ['咖啡', '阅读', '电影']},
                {username: 'ahao', password: '123456', nickname: '阿豪', gender: '男', bio: '音乐发烧友', avatar: '🎧', age: 30, interests: ['音乐', '吉他', '旅行']},
            ];
            safeSet('users', demoUsers);
        }
    }

    let currentUser = null;
    let currentChatTarget = null;

    // ==================== 后端接入层 ====================
    // 策略：启动时探测 /api/health，连得上就走服务器 + WebSocket；
    //       连不上则 serverMode=false，所有读写回退到原来的 localStorage，页面不会白屏。
    const API_BASE = location.protocol.indexOf('http') === 0 ? '' : 'http://127.0.0.1:8000';
    const WS_BASE = location.protocol.indexOf('http') === 0
        ? (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host
        : 'ws://127.0.0.1:8000';

    let serverMode = false;
    let userCache = [];              // 用户列表缓存，openChat 需要同步取用
    let ws = null;
    let wsRetry = 0;
    let authToken = safeGet('token') || '';   // 登录后后端下发的签名 token
    const onlineUsers = new Set();   // presence 在线名单
    const unread = {};               // 未读消息数 {username: n}
    const friends = new Set();       // 已是好友的用户名
    const outgoingReq = new Set();   // 我发出、待对方同意的申请
    let incomingReq = [];            // 别人发我的待处理申请 [{username,nickname,...}]

    async function api(path, method, body) {
        const opt = { method: method || 'GET', headers: {} };
        if (body !== undefined) {
            if (body instanceof FormData) {
                opt.body = body;   // 上传文件：浏览器自动带 multipart 边界，不要手设 Content-Type
            } else {
                opt.headers['Content-Type'] = 'application/json';
                opt.body = JSON.stringify(body);
            }
        }
        if (authToken) opt.headers['Authorization'] = 'Bearer ' + authToken;
        const res = await fetch(API_BASE + path, opt);
        if (!res.ok) {
            let msg = '请求失败(' + res.status + ')';
            try {
                const j = await res.json();
                if (typeof j.detail === 'string') msg = j.detail;
            } catch (e) {}
            // 凭证失效：除了登录本身，其余 401 一律强制退回登录页，免得页面在死会话上空转
            if (res.status === 401 && path.indexOf('/api/login') !== 0 && currentUser) {
                forceLogout('登录状态已失效，请重新登录');
            }
            throw new Error(msg);
        }
        return res.json();
    }

    // 强制下线：清掉会话与实时通道，回到登录页
    function forceLogout(msg) {
        if (ws) { ws.onclose = null; ws.close(); ws = null; }
        authToken = '';
        currentUser = null;
        currentChatTarget = null;
        onlineUsers.clear();
        localStorage.removeItem('token');
        localStorage.removeItem('currentUser');
        document.getElementById('appPage').style.display = 'none';
        document.getElementById('chatPage').style.display = 'none';
        document.getElementById('authPage').style.display = 'flex';
        renderModeTip();
        if (msg) alert(msg);
    }

    // 探测后端，带 2s 超时，避免服务未启时长时间卡住
    async function probeServer() {
        try {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 2000);
            await fetch(API_BASE + '/api/health', { signal: ctrl.signal });
            clearTimeout(timer);
            serverMode = true;
        } catch (e) {
            serverMode = false;
        }
        renderModeTip();
    }

    function renderModeTip() {
        const tip = document.getElementById('modeTip');
        if (!tip) return;
        if (!serverMode) {
            tip.textContent = '本地模式：后端未启动，数据只存在当前浏览器';
            tip.className = 'mode-tip off';
        } else if (ws && ws.readyState === 1) {
            tip.textContent = '已连接服务器 · 实时收发已开启';
            tip.className = 'mode-tip on';
        } else {
            tip.textContent = '已连接服务器 · 实时通道重连中';
            tip.className = 'mode-tip';
        }
    }

    // ---- 读：用户列表 / 会话列表 / 历史消息 ----
    async function loadUsers() {
        if (!currentUser) return [];
        if (serverMode) {
            userCache = await api('/api/users');   // 排除自己由服务端根据 token 完成
        } else {
            userCache = (safeGet('users') || []).filter(u => u.username !== currentUser.username);
        }
        return userCache;
    }

    async function loadChats() {
        if (!currentUser) return [];
        if (serverMode) {
            return await api('/api/chats');   // 查谁由 token 决定，客户端传 user 已无意义
        }
        // 本地降级：扫描 localStorage 里的 msg_ 键拼会话
        const users = safeGet('users') || [];
        const me = currentUser.username;
        const sessions = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (!key || key.indexOf('msg_') !== 0) continue;
            const parts = key.replace('msg_', '').split('_');
            const otherName = parts[0] === me ? parts[1] : parts[0];
            if (!otherName) continue;
            const other = users.find(u => u.username === otherName);
            const msgs = safeGet(key) || [];
            const lastMsg = msgs[msgs.length - 1];
            if (other) {
                sessions.push({ user: other, lastMsg: lastMsg ? msgPreviewLocal(lastMsg) : '', time: lastMsg ? lastMsg.time : 0 });
            }
        }
        sessions.sort((a, b) => b.time - a.time);
        return sessions;
    }

    async function loadMessages(targetUsername) {
        const key = getChatKey(currentUser.username, targetUsername);
        if (serverMode) {
            return await api('/api/messages?target=' + encodeURIComponent(targetUsername));
        }
        return safeGet('msg_' + key) || [];
    }

    // ---- 写：优先 WS，其次 HTTP 兜底，最后本地存储 ----
    // kind: text | image | video；媒体消息的 content 是站内 URL（本地降级时图片为 base64）
    function msgPreviewLocal(m) {
        if (m.kind === 'image') return '[图片]';
        if (m.kind === 'video') return '[视频]';
        return m.content;
    }

    function putMessage(targetUsername, content, kind) {
        kind = kind || 'text';
        if (serverMode && ws && ws.readyState === 1) {
            // 上屏交给服务端返回的 ack，避免本地插一条、ack 又插一条
            ws.send(JSON.stringify({ type: 'message', to: targetUsername, content: content, kind: kind }));
            return;
        }
        if (serverMode) {
            api('/api/messages', 'POST', { sender: currentUser.username, recipient: targetUsername, content: content, kind: kind })
                .then(r => onMessageArrived(r.message, true))
                .catch(e => alert('发送失败：' + e.message));
            return;
        }
        const key = getChatKey(currentUser.username, targetUsername);
        const list = safeGet('msg_' + key) || [];
        list.push({ from: currentUser.username, to: targetUsername, content: content, time: Date.now(), kind: kind });
        safeSet('msg_' + key, list);
    }

    // ---- WebSocket 长连接 ----
    function connectWS() {
        if (!serverMode || !currentUser) return;
        try {
            ws = new WebSocket(WS_BASE + '/ws/' + encodeURIComponent(currentUser.username)
                + '?token=' + encodeURIComponent(authToken));
        } catch (e) {
            return;
        }
        ws.onopen = () => { wsRetry = 0; renderModeTip(); };
        ws.onmessage = ev => {
            let pkg;
            try { pkg = JSON.parse(ev.data); } catch (e) { return; }
            handleWsPackage(pkg);
        };
        ws.onclose = () => {
            ws = null;
            onlineUsers.clear();
            renderModeTip();
            updateChatStatus();
            scheduleReconnect();
        };
        ws.onerror = () => { if (ws) ws.close(); };
    }

    // 断线退避重连：1s/2s/3s…最多 5 次间隔，避免后端挂了前端无限狂重连
    function scheduleReconnect() {
        if (!serverMode || !currentUser) return;
        wsRetry = Math.min(wsRetry + 1, 5);
        setTimeout(connectWS, 1000 * wsRetry);
    }

    function handleWsPackage(pkg) {
        if (pkg.type === 'pong') return;
        if (pkg.type === 'error') { if (pkg.msg) alert(pkg.msg); return; }
        if (pkg.type === 'typing') { onPeerTyping(pkg.from); return; }
        if (pkg.type === 'read') { onPeerRead(pkg.by); return; }
        if (pkg.type === 'friend_request') { onFriendRequest(pkg.user || { username: pkg.from }); return; }
        if (pkg.type === 'friend_accepted') { onFriendAccepted(pkg.user || { username: pkg.from }); return; }
        if (pkg.type === 'presence_sync') {
            // 刚连上时后端下发的全量在线名单，之后的 presence 都是增量
            onlineUsers.clear();
            (pkg.users || []).forEach(u => onlineUsers.add(u));
            updateChatStatus();
            return;
        }
        if (pkg.type === 'presence') {
            if (pkg.online) onlineUsers.add(pkg.username);
            else onlineUsers.delete(pkg.username);
            updateChatStatus();
            return;
        }
        if (pkg.type === 'ack') { onMessageArrived(pkg.data, true); return; }
        if (pkg.type === 'message') { onMessageArrived(pkg.data, false); }
    }

    // 消息上屏：正在看这个会话就刷新，否则计未读
    async function onMessageArrived(record, isMine) {
        if (!record || !currentUser) return;
        const peer = isMine ? record.to : record.from;
        const viewing = currentChatTarget && currentChatTarget.username === peer;
        if (!isMine && viewing) clearUnread(peer);
        if (viewing) {
            await renderMessages();
            // 我正在看又收到对方新消息：立即上报已读（对方气泡会变 ✓✓）
            if (!isMine) markReadToPeer(peer);
        } else if (!isMine) {
            addUnread(peer);
        }
    }

    // 向服务端上报：我已经看了与 peer 的会话（把 peer 发给我的消息标为已读）
    function markReadToPeer(peer) {
        if (serverMode && ws && ws.readyState === 1 && peer) {
            ws.send(JSON.stringify({ type: 'read', to: peer }));
        }
    }

    // 对方读了我发的消息：若正看该会话则重渲染，把 ✓ 变 ✓✓
    function onPeerRead(by) {
        if (currentChatTarget && currentChatTarget.username === by) renderMessages();
    }

    function addUnread(name) {
        if (!name) return;
        unread[name] = (unread[name] || 0) + 1;
        renderUnreadBadge();
    }
    function clearUnread(name) {
        delete unread[name];
        renderUnreadBadge();
    }
    function renderUnreadBadge() {
        const el = document.getElementById('unreadBadge');
        if (!el) return;
        const total = Object.keys(unread).reduce((s, k) => s + unread[k], 0);
        el.textContent = total > 99 ? '99+' : total;
        el.style.display = total > 0 ? 'inline-block' : 'none';
    }

    // 聊天顶栏在线状态（本地模式下没有服务端 presence，显“本地”）
    function updateChatStatus() {
        const el = document.getElementById('chatStatus');
        if (!el) return;
        if (!currentChatTarget) { el.textContent = ''; return; }
        if (!serverMode) {
            el.textContent = '本地模式';
            el.className = 'chat-status';
            return;
        }
        const on = onlineUsers.has(currentChatTarget.username);
        el.textContent = on ? '在线' : '离线';
        el.className = 'chat-status ' + (on ? 'on' : 'off');
    }

    // 内联 onclick 里的参数转义：先转 JS 字符串，再转 HTML 属性
    function jsAttr(s) {
        return String(s == null ? '' : s)
            .replace(/\\/g, '\\\\').replace(/'/g, "\\'")
            .replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ===== 头像相关 =====
    const AVATAR_EMOJIS = ['😀','😎','🥰','🐱','🐶','🦊','🐼','🐻','🌸','🌟','🎧','⚽','🎮','🍰','🚀','🌈'];
    let regAvatar = '';

    // 头像来源解析：站内上传 URL / data: / http 外链 都当图片；否则按 emoji/文字处理
    function avatarSrc(a) {
        if (typeof a !== 'string' || !a) return null;
        if (a.indexOf('data:image/') === 0) return a;
        if (a.indexOf('/uploads/') === 0) return API_BASE + a;
        if (/^https?:\/\//.test(a)) return a;
        return null;
    }

    // 返回头像内部内容：图片 > 表情 > 昵称首字；avatar 是用户可写字段，必须限制格式防注入
    function avatarInner(user) {
        if (!user) return '?';
        const src = avatarSrc(user.avatar);
        if (src) return `<img src="${jsAttr(src)}" alt="">`;
        const a = user.avatar;
        if (typeof a === 'string' && a && a.length <= 8 && a.indexOf('<') < 0) return escapeHtml(a);
        return escapeHtml((user.nickname || '?').charAt(0));
    }

    function initAvatarPicker() {
        const row = document.getElementById('emojiAvatarRow');
        if (!row) return;
        row.innerHTML = AVATAR_EMOJIS.map(e => `<span onclick="selectAvatarEmoji('${e}')">${e}</span>`).join('');
    }
    function selectAvatarEmoji(e) {
        regAvatar = e;
        updateAvatarPreview(e);
    }
    function handleAvatarUpload(ev) {
        const file = ev.target.files[0];
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) {
            alert('图片过大，请选择 2MB 以内的图片');
            ev.target.value = '';
            return;
        }
        if (serverMode) {
            // 注册阶段必须“强制匿名”上传（故意不带 Authorization）：避免本地残留旧 token 时
            // 把图片误关联到上一个登录账号。图片先落盘拿 URL，最终随 /api/register 提交。
            const fd = new FormData();
            fd.append('file', file);
            fetch(API_BASE + '/api/avatar', { method: 'POST', body: fd })
                .then(async res => {
                    const j = await res.json();
                    if (!res.ok) throw new Error(j.detail || ('上传失败(' + res.status + ')'));
                    regAvatar = j.url; updateAvatarPreview(j.url);
                })
                .catch(e => { alert('头像上传失败：' + e.message); ev.target.value = ''; });
            return;
        }
        // 本地降级：仍用 base64 存 localStorage
        const reader = new FileReader();
        reader.onload = function() {
            regAvatar = reader.result;
            updateAvatarPreview(reader.result);
        };
        reader.readAsDataURL(file);
    }
    function updateAvatarPreview(val) {
        const preview = document.getElementById('regAvatarPreview');
        const src = avatarSrc(val);
        if (src) {
            preview.innerHTML = `<img src="${jsAttr(src)}" alt="">`;
        } else {
            preview.textContent = val || '?';
        }
    }

    // ===== 个人中心：登录后更换头像 =====
    function initProfileAvatarPicker() {
        const row = document.getElementById('profileEmojiRow');
        if (!row) return;
        row.innerHTML = AVATAR_EMOJIS.map(e => `<span onclick="changeAvatarEmoji('${e}')">${e}</span>`).join('');
    }
    async function changeAvatarEmoji(e) {
        if (!serverMode) {           // 本地模式：只改内存中的 currentUser
            currentUser.avatar = e; safeSet('currentUser', currentUser); renderProfile(); return;
        }
        try {
            await api('/api/me/avatar', 'POST', { avatar: e });
            currentUser.avatar = e; safeSet('currentUser', currentUser); renderProfile();
        } catch (err) { alert('更换头像失败：' + err.message); }
    }
    function handleProfileAvatarUpload(ev) {
        const file = ev.target.files[0];
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) {
            alert('图片过大，请选择 2MB 以内的图片');
            ev.target.value = '';
            return;
        }
        if (!serverMode) {
            const reader = new FileReader();
            reader.onload = function() {
                currentUser.avatar = reader.result;
                safeSet('currentUser', currentUser); renderProfile();
            };
            reader.readAsDataURL(file);
            return;
        }
        // 已登录上传：后端直接落盘并写库，返回 URL
        const fd = new FormData();
        fd.append('file', file);
        api('/api/avatar', 'POST', fd)
            .then(j => { currentUser.avatar = j.url; safeSet('currentUser', currentUser); renderProfile(); })
            .catch(e => { alert('更换头像失败：' + e.message); ev.target.value = ''; });
    }

    // ===== 兴趣标签选择器（注册页与资料编辑弹窗共用一套 DOM 约定：.tag-chip.on 即选中）=====
    const INTEREST_PRESETS = ['旅行', '摄影', '美食', '音乐', '电影', '健身', '游戏', '阅读', '咖啡', '宠物', '篮球', '骑行', '烘焙', '展览'];
    const INTEREST_MAX = 20;

    function interestBox(scope) { return document.getElementById(scope === 'reg' ? 'regInterestRow' : 'editInterestRow'); }
    function interestBoxInput(scope) { return document.getElementById(scope === 'reg' ? 'regInterestInput' : 'editInterestInput'); }

    function renderInterestRow(scope, selected) {
        const box = interestBox(scope);
        if (!box) return;
        const sel = (selected || []).filter(Boolean);
        // 预设之外已存在的自定义标签也一并追到后面，避免回显时丢数据
        const all = INTEREST_PRESETS.concat(sel.filter(t => INTEREST_PRESETS.indexOf(t) < 0));
        box.innerHTML = all.map(t =>
            `<span class="tag-chip${sel.indexOf(t) >= 0 ? ' on' : ''}" onclick="toggleInterest(this)">${escapeHtml(t)}</span>`).join('');
    }
    function toggleInterest(el) { el.classList.toggle('on'); }

    function readInterests(scope) {
        const box = interestBox(scope);
        if (!box) return [];
        return Array.from(box.querySelectorAll('.tag-chip.on')).map(c => c.textContent.trim()).slice(0, INTEREST_MAX);
    }

    function addInterest(scope) {
        const inp = interestBoxInput(scope);
        const box = interestBox(scope);
        if (!inp || !box) return;
        const val = inp.value.trim().slice(0, 24);
        if (!val) return;
        const chips = Array.from(box.querySelectorAll('.tag-chip'));
        const hit = chips.find(c => c.textContent.trim() === val);
        if (hit) { hit.classList.add('on'); }        // 已有就置为选中，不插重复项
        else if (readInterests(scope).length >= INTEREST_MAX) { alert('最多选择 ' + INTEREST_MAX + ' 个兴趣标签'); return; }
        else {
            const chip = document.createElement('span');
            chip.className = 'tag-chip on';
            chip.textContent = val;                   // 用 textContent 插入，不担心注入
            chip.onclick = function() { this.classList.toggle('on'); };
            box.appendChild(chip);
        }
        inp.value = '';
    }

    // 切换登录注册
    function switchToRegister() {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.remove('hidden');
        document.getElementById('authTitle').innerText = '注册账号';
    }
    function switchToLogin() {
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('authTitle').innerText = '登录账号';
    }

    // 注册
    async function handleRegister() {
        const username = document.getElementById('regUsername').value.trim();
        const nickname = document.getElementById('regNickname').value.trim();
        const gender = document.getElementById('regGender').value;
        const bio = document.getElementById('regBio').value.trim();
        const age = parseInt(document.getElementById('regAge').value, 10) || 0;
        const interests = readInterests('reg');
        const password = document.getElementById('regPassword').value;
        const password2 = document.getElementById('regPassword2').value;

        if (!username || !nickname || !password) {
            alert('请填写完整信息');
            return;
        }
        if (age < 0 || age > 120) {
            alert('年龄需在 0-120 之间，不填请留空');
            return;
        }
        if (password !== password2) {
            alert('两次密码不一致');
            return;
        }

        if (serverMode) {
            try {
                await api('/api/register', 'POST',
                    { username, nickname, gender, bio, password, avatar: regAvatar, age, interests });
            } catch (e) {
                alert('注册失败：' + e.message);
                return;
            }
        } else {
            let users = safeGet('users') || [];
            if (users.find(u => u.username === username)) {
                alert('该账号已被注册');
                return;
            }
            users.push({username, nickname, gender, bio, password, avatar: regAvatar, age, interests});
            safeSet('users', users);
        }

        regAvatar = '';
        document.getElementById('regAvatarFile').value = '';
        document.getElementById('regAge').value = '';
        updateAvatarPreview('');
        renderInterestRow('reg', []);
        alert('注册成功，请登录');
        switchToLogin();
    }

    // 登录
    async function handleLogin() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        if (!username || !password) {
            alert('请输入账号和密码');
            return;
        }

        if (serverMode) {
            try {
                const data = await api('/api/login', 'POST', { username, password });
                // 登录接口一次返回“脱敏用户资料 + token”，两者拆开存
                authToken = data.token || '';
                delete data.token;
                delete data.expiresAt;
                currentUser = data;
                safeSet('token', authToken);
            } catch (e) {
                alert(e.message);
                return;
            }
        } else {
            const user = (safeGet('users') || []).find(u => u.username === username && u.password === password);
            if (!user) {
                alert('账号或密码错误');
                return;
            }
            currentUser = user;
        }
        safeSet('currentUser', currentUser);
        await enterApp();
    }

    // 退出登录
    function handleLogout() {
        if (!confirm('确定退出登录吗？')) return;
        if (ws) {
            ws.onclose = null;   // 主动退出不要触发自动重连
            ws.close();
            ws = null;
        }
        onlineUsers.clear();
        Object.keys(unread).forEach(k => delete unread[k]);
        renderUnreadBadge();
        friends.clear(); outgoingReq.clear(); incomingReq = [];
        renderReqBadge();
        const frs = document.getElementById('friendReqSection'); if (frs) frs.innerHTML = '';
        closeProfileModal();
        closeProfileEdit();
        closeMediaViewer();
        currentUser = null;
        currentChatTarget = null;
        authToken = '';
        localStorage.removeItem('currentUser');
        localStorage.removeItem('token');
        document.getElementById('appPage').style.display = 'none';
        document.getElementById('authPage').style.display = 'flex';
        renderModeTip();
    }

    // 进入主应用
    async function enterApp() {
        document.getElementById('authPage').style.display = 'none';
        document.getElementById('appPage').style.display = 'block';
        connectWS();
        renderModeTip();
        try {
            await loadFriendship();
            await renderUserList();
            await renderChatList();
            renderFriendRequests();
        } catch (e) {
            console.error('加载数据失败', e);
        }
        renderProfile();
    }

    // 拉取好友关系与待处理申请（服务端模式下）
    async function loadFriendship() {
        if (!serverMode || !currentUser) return;
        try {
            const list = await api('/api/friends');
            friends.clear();
            (list || []).forEach(u => friends.add(u.username));
            const reqs = await api('/api/friends/requests');
            incomingReq = (reqs && reqs.incoming) || [];
            outgoingReq.clear();
            ((reqs && reqs.outgoing) || []).forEach(u => outgoingReq.add(u));
            renderReqBadge();
        } catch (e) {
            console.error('好友数据加载失败', e);
        }
    }

    // 渲染“好友申请”区（消息页顶部）
    function renderFriendRequests() {
        const box = document.getElementById('friendReqSection');
        if (!box) return;
        if (!serverMode || incomingReq.length === 0) { box.innerHTML = ''; return; }
        let html = '<div class="section-title">好友申请</div>';
        incomingReq.forEach(r => {
            const name = jsAttr(r.username);
            html += `
            <div class="req-card">
                <div class="avatar" style="cursor:pointer;" onclick="openProfileModal('${name}')">${avatarInner(r)}</div>
                <div class="user-info">
                    <div class="user-nick">${escapeHtml(r.nickname || r.username)}</div>
                    <div class="user-bio">想加你为好友</div>
                </div>
                <div class="req-actions">
                    <button class="btn-accept" onclick="respondFriend('${name}', true)">同意</button>
                    <button class="btn-reject" onclick="respondFriend('${name}', false)">拒绝</button>
                </div>
            </div>`;
        });
        box.innerHTML = html;
    }

    function renderReqBadge() {
        const el = document.getElementById('reqBadge');
        if (!el) return;
        const n = serverMode ? incomingReq.length : 0;
        el.textContent = n > 99 ? '99+' : n;
        el.style.display = n > 0 ? 'inline-block' : 'none';
    }

    // 发起好友申请
    async function requestFriend(name) {
        if (!serverMode) {           // 本地模式无多端，直接放行
            friends.add(name); renderUserList(); return;
        }
        try {
            await api('/api/friends/request', 'POST', { to: name });
            outgoingReq.add(name);
            renderUserList();
        } catch (e) {
            alert('发送好友申请失败：' + e.message);
        }
    }

    // 处理收到的好友申请
    async function respondFriend(name, accept) {
        if (serverMode) {
            try {
                await api('/api/friends/respond', 'POST', { target: name, accept: accept });
                incomingReq = incomingReq.filter(x => x.username !== name);
                if (accept) {
                    friends.add(name);
                    outgoingReq.delete(name);
                    userCache = await loadUsers();   // 刷新广场缓存，便于直接私信
                }
                renderReqBadge(); renderFriendRequests(); renderUserList();
            } catch (e) {
                alert('处理好友申请失败：' + e.message);
            }
        } else {
            incomingReq = incomingReq.filter(x => x.username !== name);
            renderFriendRequests();
        }
    }

    // 收到别人的好友申请
    function onFriendRequest(user) {
        if (!user || !user.username) return;
        if (incomingReq.some(r => r.username === user.username)) return;
        incomingReq.push(user);
        renderReqBadge(); renderFriendRequests(); renderUserList();
    }

    // 我发出的申请被对方同意
    function onFriendAccepted(user) {
        if (!user || !user.username) return;
        friends.add(user.username);
        outgoingReq.delete(user.username);
        renderUserList();
    }

    // ===== 用户主页弹窗 =====
    let modalUser = null;

    async function fetchProfile(username) {
        if (serverMode) {
            return await api('/api/profile?username=' + encodeURIComponent(username));
        }
        return (safeGet('users') || []).find(u => u.username === username) || null;
    }

    async function openProfileModal(username) {
        if (!username) return;
        let u;
        try {
            u = await fetchProfile(username);
        } catch (e) {
            alert('加载主页失败：' + e.message);
            return;
        }
        if (!u) { alert('用户不存在'); return; }
        modalUser = u;
        renderProfileModal();
        document.getElementById('profileModal').classList.remove('hidden');
    }

    function closeProfileModal() {
        document.getElementById('profileModal').classList.add('hidden');
        modalUser = null;
    }

    // 聊天顶栏头像 → 对方主页
    function openChatProfile() {
        if (currentChatTarget) openProfileModal(currentChatTarget.username);
    }

    function interestTagsHtml(list) {
        const arr = (list || []).filter(Boolean);
        if (!arr.length) return '<span class="tag-mini empty">还没有兴趣爱好</span>';
        return arr.map(t => `<span class="tag-mini">${escapeHtml(t)}</span>`).join('');
    }

    function renderProfileModal() {
        const u = modalUser;
        if (!u) return;
        const isMe = !!currentUser && u.username === currentUser.username;
        const cover = u.cover ? ` style="background-image:url('${jsAttr(mediaSrc(u.cover))}')"` : '';
        let actions;
        if (isMe) {
            actions = `<button class="btn-friend" onclick="gotoMyProfile()">我的主页</button>` +
                      `<button class="btn-primary" style="margin:0;" onclick="closeProfileModal(); openProfileEdit()">编辑资料</button>`;
        } else if (friends.has(u.username)) {
            actions = `<button class="btn-friend is-friend" onclick="closeProfileModal(); openChat('${jsAttr(u.username)}')">私信</button>`;
        } else if (incomingReq.some(r => r.username === u.username)) {
            actions = `<button class="btn-accept" onclick="respondFriend('${jsAttr(u.username)}', true); closeProfileModal()">同意好友申请</button>` +
                      `<button class="btn-reject" onclick="respondFriend('${jsAttr(u.username)}', false); closeProfileModal()">拒绝</button>`;
        } else if (outgoingReq.has(u.username)) {
            actions = `<button class="btn-friend is-pending" disabled>等待对方同意</button>`;
        } else {
            actions = `<button class="btn-friend" onclick="requestFriend('${jsAttr(u.username)}'); closeProfileModal()">加为好友</button>`;
        }
        const meta = [
            u.gender || '性别未填',
            u.age ? u.age + ' 岁' : '年龄未填',
            '@' + u.username
        ].join(' · ');
        document.getElementById('profileModalBody').innerHTML = `
            <div class="pm-cover"${cover}></div>
            <div class="pm-body">
                <div class="pm-avatar">${avatarInner(u)}</div>
                <div class="pm-name">${escapeHtml(u.nickname || u.username)}${isMe ? '<span class="pm-self">我</span>' : ''}</div>
                <div class="pm-meta">${escapeHtml(meta)}</div>
                <div class="pm-bio">${escapeHtml(u.bio || '这个人很懒，什么都没写')}</div>
                <div class="pm-block-title">兴趣爱好</div>
                <div>${interestTagsHtml(u.interests)}</div>
                <div class="pm-actions">${actions}</div>
            </div>`;
    }

    // 没有导航元素引用时按名字切 tab（主页弹窗里用）
    function switchTabByName(tab) {
        const idx = { square: 0, message: 1, profile: 2 }[tab];
        const items = document.querySelectorAll('.nav-item');
        if (idx != null && items[idx]) switchTab(tab, items[idx]);
    }

    // 从聊天页里点自己头像进个人中心：得先退出聊天页，否则聊天页会盖在主应用上面
    function gotoMyProfile() {
        closeProfileModal();
        if (document.getElementById('chatPage').style.display === 'flex') backFromChat();
        switchTabByName('profile');
    }

    // ===== 资料编辑（头像 / 封面 / 文字字段全部自助）=====
    let editDraft = null;

    function openProfileEdit() {
        if (!currentUser) return;
        editDraft = { avatar: currentUser.avatar || '', cover: currentUser.cover || '' };
        document.getElementById('editNickname').value = currentUser.nickname || '';
        document.getElementById('editGender').value = currentUser.gender || '';
        document.getElementById('editAge').value = currentUser.age || '';
        document.getElementById('editBio').value = currentUser.bio || '';
        document.getElementById('editInterestInput').value = '';
        renderInterestRow('edit', currentUser.interests || []);
        const row = document.getElementById('editEmojiRow');
        if (row) row.innerHTML = AVATAR_EMOJIS.map(e => `<span onclick="pickEditAvatar('${e}')">${e}</span>`).join('');
        updateEditAvatarPreview();
        updateEditCover();
        document.getElementById('profileEditModal').classList.remove('hidden');
    }

    function closeProfileEdit() {
        document.getElementById('profileEditModal').classList.add('hidden');
        editDraft = null;
    }

    function updateEditAvatarPreview() {
        const el = document.getElementById('editAvatarPreview');
        if (!el || !editDraft) return;
        el.innerHTML = avatarInner({ avatar: editDraft.avatar, nickname: currentUser.nickname });
    }

    function updateEditCover() {
        const el = document.getElementById('editCoverPreview');
        if (!el || !editDraft) return;
        el.style.backgroundImage = editDraft.cover ? `url('${mediaSrc(editDraft.cover)}')` : '';
    }

    function clearEditCover() {
        if (!editDraft) return;
        editDraft.cover = '';
        updateEditCover();
    }

    function pickEditAvatar(e) {
        if (!editDraft) return;
        editDraft.avatar = e;
        updateEditAvatarPreview();
    }

    // 编辑弹窗里换头像：已登录，后端传完直接写库，保存时再随 PUT /api/me 同步一次
    function handleEditAvatarPick(ev) {
        const file = ev.target.files[0];
        if (!file || !editDraft) return;
        if (file.size > 2 * 1024 * 1024) {
            alert('头像请选择 2MB 以内的图片');
            ev.target.value = '';
            return;
        }
        if (!serverMode) {
            const reader = new FileReader();
            reader.onload = function() {
                editDraft.avatar = reader.result;
                updateEditAvatarPreview();
            };
            reader.readAsDataURL(file);
            return;
        }
        const fd = new FormData();
        fd.append('file', file);
        api('/api/avatar', 'POST', fd)
            .then(j => {
                editDraft.avatar = j.url;
                currentUser.avatar = j.url;
                safeSet('currentUser', currentUser);
                updateEditAvatarPreview();
                renderProfile();
            })
            .catch(e => { alert('上传失败：' + e.message); ev.target.value = ''; });
    }

    // 封面图：走 /api/media 落盘，拿到 URL 后随“保存”写库
    function handleCoverPick(ev) {
        const file = ev.target.files[0];
        if (!file || !editDraft) return;
        if (file.size > MAX_IMAGE_BYTES) {
            alert('封面请选择 5MB 以内的图片');
            ev.target.value = '';
            return;
        }
        if (!serverMode) {
            const reader = new FileReader();
            reader.onload = function() {
                try {
                    editDraft.cover = reader.result;
                    updateEditCover();
                } catch (e) {
                    alert('本地保存失败：图片过大');
                }
            };
            reader.readAsDataURL(file);
            return;
        }
        const fd = new FormData();
        fd.append('file', file);
        api('/api/media', 'POST', fd)
            .then(j => { editDraft.cover = j.url; updateEditCover(); })
            .catch(e => { alert('上传失败：' + e.message); ev.target.value = ''; });
    }

    async function saveProfileEdit() {
        if (!currentUser || !editDraft) return;
        const nickname = document.getElementById('editNickname').value.trim();
        if (!nickname) { alert('昵称不能为空'); return; }
        const ageInput = document.getElementById('editAge').value;
        const age = ageInput === '' ? 0 : (parseInt(ageInput, 10) || 0);
        if (age < 0 || age > 120) { alert('年龄需在 0-120 之间'); return; }
        const payload = {
            nickname: nickname,
            gender: document.getElementById('editGender').value,
            age: age,
            bio: document.getElementById('editBio').value.trim(),
            interests: readInterests('edit'),
            avatar: editDraft.avatar,
            cover: editDraft.cover,
        };
        if (serverMode) {
            let updated;
            try {
                updated = await api('/api/me', 'PUT', payload);
            } catch (e) {
                alert('保存失败：' + e.message);
                return;
            }
            currentUser = updated;
        } else {
            currentUser = Object.assign({}, currentUser, payload);
            const users = safeGet('users') || [];
            const i = users.findIndex(u => u.username === currentUser.username);
            if (i >= 0) { users[i] = currentUser; safeSet('users', users); }
        }
        safeSet('currentUser', currentUser);
        closeProfileEdit();
        renderProfile();
        try { await renderUserList(); } catch (e) {}
        if (currentChatTarget) renderMessages();
        alert('资料已更新');
    }

    // 切换底部tab
    function switchTab(tab, el) {
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('tabSquare').classList.add('hidden');
        document.getElementById('tabMessage').classList.add('hidden');
        document.getElementById('tabProfile').classList.add('hidden');
        document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.remove('hidden');
        if (tab === 'message') {
            renderFriendRequests();
            renderChatList();
            clearUnreadAll();
        } else if (tab === 'square') {
            renderUserList();
        }
    }

    function clearUnreadAll() {
        Object.keys(unread).forEach(k => delete unread[k]);
        renderUnreadBadge();
    }

    // 渲染用户广场
    async function renderUserList() {
        if (!currentUser) return;
        const container = document.getElementById('userList');
        let otherUsers;
        try {
            otherUsers = await loadUsers();
        } catch (e) {
            container.innerHTML = '<div class="empty-tip">' + escapeHtml(e.message) + '</div>';
            return;
        }
        if (otherUsers.length === 0) {
            container.innerHTML = '<div class="empty-tip">暂无其他用户</div>';
            return;
        }
        let html = '';
        otherUsers.forEach(u => {
            const name = jsAttr(u.username);
            let btn;
            if (friends.has(u.username)) {
                btn = `<button class="btn-friend is-friend" onclick="event.stopPropagation(); openChat('${name}')">私信</button>`;
            } else if (incomingReq.some(r => r.username === u.username)) {
                btn = `<button class="btn-friend is-incoming" onclick="event.stopPropagation(); respondFriend('${name}', true)">同意</button>`;
            } else if (outgoingReq.has(u.username)) {
                btn = `<button class="btn-friend is-pending" disabled>待通过</button>`;
            } else {
                btn = `<button class="btn-friend" onclick="event.stopPropagation(); requestFriend('${name}')">加好友</button>`;
            }
            const meta = [u.gender, u.age ? u.age + '岁' : ''].filter(Boolean).join(' · ');
            html += `
            <div class="user-card" onclick="openChat('${name}')">
                <div class="avatar" style="cursor:pointer;" title="查看主页" onclick="event.stopPropagation(); openProfileModal('${name}')">${avatarInner(u)}</div>
                <div class="user-info">
                    <div class="user-nick">${escapeHtml(u.nickname)}${meta ? `<span class="nick-meta">${escapeHtml(meta)}</span>` : ''}</div>
                    <div class="user-bio">${escapeHtml(u.bio || '这个人很懒，什么都没写')}</div>
                </div>
                ${btn}
            </div>
            `;
        });
        container.innerHTML = html;
    }

    // 渲染个人中心
    function renderProfile() {
        if (!currentUser) return;
        const cover = document.getElementById('myCover');
        if (cover) cover.style.backgroundImage = currentUser.cover ? `url('${mediaSrc(currentUser.cover)}')` : '';
        document.getElementById('myAvatar').innerHTML = avatarInner(currentUser);
        document.getElementById('myNickname').innerText = currentUser.nickname;
        document.getElementById('myUsername').innerText = currentUser.username;
        document.getElementById('myGender').innerText = currentUser.gender || '未填写';
        document.getElementById('myAge').innerText = currentUser.age ? currentUser.age + ' 岁' : '未填写';
        document.getElementById('myBio').innerText = currentUser.bio || '暂无简介';
        document.getElementById('myInterests').innerHTML = interestTagsHtml(currentUser.interests);
    }

    // 获取会话key（与后端 chat_key 算法一致：两边用户名排序后拼接）
    function getChatKey(u1, u2) {
        return [u1, u2].sort().join('_');
    }

    // 打开聊天
    async function openChat(targetUsername) {
        let target = userCache.find(u => u.username === targetUsername);
        if (!target) {
            // 会话列表里的用户不在广场缓存里时，补一次拉取
            try { target = (await loadUsers()).find(u => u.username === targetUsername); } catch (e) {}
        }
        if (!target) {
            alert('用户不存在');
            return;
        }
        // 好友门槛：服务端模式下不是好友不能直接私聊，引导走加好友/同意流程
        if (serverMode && !friends.has(target.username)) {
            if (incomingReq.some(r => r.username === target.username)) {
                respondFriend(target.username, true);
            } else if (outgoingReq.has(target.username)) {
                alert('已向 ' + target.nickname + ' 发送好友申请，等待对方同意');
            } else {
                requestFriend(target.username);
            }
            return;
        }
        currentChatTarget = target;
        document.getElementById('chatTargetNick').innerText = target.nickname;
        document.getElementById('chatTargetAvatar').innerHTML = avatarInner(target);
        document.getElementById('emojiPanel').classList.add('hidden');
        document.getElementById('appPage').style.display = 'none';
        document.getElementById('chatPage').style.display = 'flex';
        clearUnread(targetUsername);
        updateChatStatus();
        await renderMessages();
        markReadToPeer(targetUsername);   // 打开会话即把对方发我的消息标为已读
        document.getElementById('chatInput').focus();
    }

    // 返回
    function backFromChat() {
        document.getElementById('chatPage').style.display = 'none';
        document.getElementById('appPage').style.display = 'block';
        currentChatTarget = null;
        renderChatList();
    }

    // 渲染消息（在线从服务端拉，本地从 localStorage 拉）
    async function renderMessages() {
        if (!currentUser || !currentChatTarget) return;
        const target = currentChatTarget.username;   // 异步回来后再比对，防止用户已切会话
        let messages;
        try {
            messages = await loadMessages(target);
        } catch (e) {
            console.error('拉取消息失败', e);
            return;
        }
        if (!currentChatTarget || currentChatTarget.username !== target) return;
        const container = document.getElementById('chatMessages');
        if (messages.length === 0) {
            container.innerHTML = '<div class="empty-tip">还没有消息，发送第一条打个招呼吧～</div>';
            return;
        }
        let html = '';
        let lastTime = 0;
        messages.forEach(m => {
            // 相邻消息间隔超过 5 分钟时插入时间分隔
            if (m.time - lastTime > 5 * 60 * 1000) {
                html += `<div class="msg-time">${formatTime(m.time)}</div>`;
                lastTime = m.time;
            }
            const isMine = m.from === currentUser.username;
            const sender = isMine ? currentUser : currentChatTarget;
            const status = isMine
                ? `<div class="msg-status ${m.read ? 'read' : ''}">${m.read ? '✓✓' : '✓'}</div>` : '';
            const kind = m.kind || 'text';
            let bubble;
            if (kind === 'image' || kind === 'video') {
                // 媒体地址只来自后端上传接口或本地 FileReader，但仍统一过 jsAttr 转义
                const src = mediaSrc(m.content);
                bubble = kind === 'video'
                    ? `<div class="msg-bubble media"><span class="msg-media">` +
                      `<video src="${jsAttr(src)}" controls preload="metadata" onerror="mediaLoadError(this)"></video></span></div>`
                    : `<div class="msg-bubble media"><span class="msg-media">` +
                      `<img src="${jsAttr(src)}" alt="图片" loading="lazy" onclick="openMediaViewer('${jsAttr(src)}','image')" onerror="mediaLoadError(this)"></span></div>`;
            } else {
                bubble = `<div class="msg-bubble">${escapeHtml(m.content)}</div>`;
            }
            html += `
            <div class="msg-item ${isMine ? 'mine' : 'other'}">
                <div class="msg-avatar" onclick="openProfileModal('${jsAttr(sender.username)}')">${avatarInner(sender)}</div>
                <div class="msg-bubble-wrap">
                    ${bubble}
                    ${status}
                </div>
            </div>
            `;
        });
        container.innerHTML = html;
        scrollBottom();
    }

    function scrollBottom() {
        const container = document.getElementById('chatMessages');
        setTimeout(() => { container.scrollTop = container.scrollHeight; }, 10);
    }

    // 上传文件已被清理或路径失效时给个降级提示，不留白块
    function mediaLoadError(el) {
        const tip = document.createElement('span');
        tip.style.cssText = 'display:inline-block;padding:14px;color:#999;font-size:13px;';
        tip.textContent = '内容已失效，无法加载';
        if (el.parentNode) { el.parentNode.replaceChild(tip, el); }
    }

    // 格式化聊天时间（今天显示时分，昨天/更早带日期）
    function formatTime(ts) {
        const d = new Date(ts);
        const now = new Date();
        const pad = n => n.toString().padStart(2, '0');
        const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
        if (d.toDateString() === now.toDateString()) return hm;
        const yesterday = new Date(now);
        yesterday.setDate(now.getDate() - 1);
        if (d.toDateString() === yesterday.toDateString()) return '昨天 ' + hm;
        return `${d.getMonth() + 1}月${d.getDate()}日 ${hm}`;
    }

    // 防止消息内容中的 HTML 注入
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str == null ? '' : str;
        return div.innerHTML;
    }

    // 发送消息
    function sendMessage() {
        const input = document.getElementById('chatInput');
        const content = input.value.trim();
        if (!content || !currentChatTarget) return;
        input.value = '';
        putMessage(currentChatTarget.username, content, 'text');
        // 在线模式下等服务端 ack 回推再渲染，避免同一条消息插两次
        if (!serverMode) renderMessages();
    }

    // ---- 发送图片 / 短视频 ----
    const MAX_IMAGE_BYTES = 5 * 1024 * 1024;
    const MAX_VIDEO_BYTES = 50 * 1024 * 1024;

    // 媒体地址归一：站内上传路径拼上后端地址，data: 直接用
    function mediaSrc(u) {
        if (typeof u !== 'string' || !u) return '';
        if (u.indexOf('/uploads/') === 0) return API_BASE + u;
        return u;
    }

    function pickMedia(kind) {
        if (!currentChatTarget) { alert('请先打开一个会话'); return; }
        const el = document.getElementById(kind === 'video' ? 'mediaVideoInput' : 'mediaImageInput');
        if (!el) return;
        el.value = '';
        el.click();
    }

    function handleMediaPick(ev, kind) {
        const file = ev.target.files[0];
        if (!file || !currentChatTarget) return;
        const target = currentChatTarget.username;
        const limit = kind === 'video' ? MAX_VIDEO_BYTES : MAX_IMAGE_BYTES;
        if (file.size > limit) {
            alert(kind === 'video' ? '视频过大，请选择 50MB 以内的短视频' : '图片过大，请选择 5MB 以内的图片');
            ev.target.value = '';
            return;
        }
        if (!serverMode) {
            // 本地降级：图片转 base64 存 localStorage；视频体积必然撞破存储配额，直接提示
            if (kind === 'video') {
                alert('本地模式不支持发送视频，请启动后端服务后使用');
                ev.target.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = function() {
                try {
                    putMessage(target, reader.result, 'image');
                    if (currentChatTarget && currentChatTarget.username === target) renderMessages();
                } catch (e) {
                    alert('本地保存失败：图片过大，浏览器存储已满');
                }
            };
            reader.readAsDataURL(file);
            return;
        }
        const fd = new FormData();
        fd.append('file', file);
        api('/api/media', 'POST', fd)
            .then(j => {
                if (currentChatTarget && currentChatTarget.username === target) {
                    putMessage(target, j.url, j.kind || kind);   // 上屏同样等 ack
                }
            })
            .catch(e => { alert('上传失败：' + e.message); ev.target.value = ''; });
    }

    function openMediaViewer(src, kind) {
        if (!src) return;
        const box = document.getElementById('mediaViewerBody');
        box.innerHTML = kind === 'video'
            ? `<video src="${jsAttr(src)}" controls autoplay></video>`
            : `<img src="${jsAttr(src)}" alt="">`;
        document.getElementById('mediaViewer').classList.remove('hidden');
    }
    function closeMediaViewer() {
        document.getElementById('mediaViewerBody').innerHTML = '';   // 先停掉正在播放的视频
        document.getElementById('mediaViewer').classList.add('hidden');
    }

    // 输入中提示：仅在线模式，1s 节流，不要每个字符发一帧
    let typingLast = 0;
    function notifyTyping() {
        if (!serverMode || !ws || ws.readyState !== 1 || !currentChatTarget) return;
        const now = Date.now();
        if (now - typingLast < 1000) return;
        typingLast = now;
        ws.send(JSON.stringify({ type: 'typing', to: currentChatTarget.username }));
    }

    // 收到对方 typing：气泡显示“正在输入”，3s 无后续自动收起
    let typingTimer = null;
    function onPeerTyping(fromName) {
        if (!currentChatTarget || currentChatTarget.username !== fromName) return;
        showTyping();
        clearTimeout(typingTimer);
        typingTimer = setTimeout(hideTyping, 3000);
    }

    function showTyping() {
        const container = document.getElementById('chatMessages');
        if (document.getElementById('typingRow') || !currentChatTarget) return;
        const div = document.createElement('div');
        div.id = 'typingRow';
        div.className = 'msg-item other';
        div.innerHTML = `
            <div class="msg-avatar">${avatarInner(currentChatTarget)}</div>
            <div class="msg-bubble-wrap">
                <div class="msg-bubble typing">正在输入<span class="dots"><i>.</i><i>.</i><i>.</i></span></div>
            </div>`;
        container.appendChild(div);
        scrollBottom();
    }
    function hideTyping() {
        const el = document.getElementById('typingRow');
        if (el) el.remove();
    }

    // 表情面板
    const EMOJIS = ['😀','😄','😂','🥰','😍','😉','😊','😘','🤗','👍','❤️','🎉','🌹','😎','🥳','😅','🤔','😭','🙈','💕','☕','🍻','✈️','🌙'];
    function initEmoji() {
        const panel = document.getElementById('emojiPanel');
        panel.innerHTML = EMOJIS.map(e => `<span onclick="insertEmoji('${e}')">${e}</span>`).join('');
    }
    function toggleEmoji() {
        document.getElementById('emojiPanel').classList.toggle('hidden');
    }
    function insertEmoji(e) {
        const input = document.getElementById('chatInput');
        input.value += e;
        input.focus();
    }

    // 渲染会话列表
    async function renderChatList() {
        if (!currentUser) return;
        const container = document.getElementById('chatList');
        let sessions;
        try {
            sessions = await loadChats();
        } catch (e) {
            container.innerHTML = '<div class="empty-tip">' + escapeHtml(e.message) + '</div>';
            return;
        }
        if (sessions.length === 0) {
            container.innerHTML = '<div class="empty-tip">暂无会话，去广场打个招呼吧</div>';
            return;
        }
        let html = '';
        sessions.forEach(s => {
            const name = jsAttr(s.user.username);
            html += `
            <div class="user-card" onclick="openChat('${name}')">
                <div class="avatar" style="cursor:pointer;" title="查看主页" onclick="event.stopPropagation(); openProfileModal('${name}')">${avatarInner(s.user)}</div>
                <div class="user-info">
                    <div class="user-nick">${escapeHtml(s.user.nickname)}</div>
                    <div class="user-bio">${escapeHtml(s.lastMsg)}</div>
                </div>
            </div>
            `;
        });
        container.innerHTML = html;
    }

    // 页面加载完成后执行
    window.addEventListener('DOMContentLoaded', async function() {
        try {
            initDemoUsers();      // 仅供降级模式使用，后端自己会 seed 演示用户
            initEmoji();
            initAvatarPicker();
            initProfileAvatarPicker();
            renderInterestRow('reg', []);
            renderUnreadBadge();
            await probeServer();

            const saved = safeGet('currentUser');
            if (saved && saved.username) {
                currentUser = saved;
                if (serverMode) {
                    // 本地只有用户对象、没有密码，无法重新登录；
                    // 拿 token 调 /api/me 刷新一次资料，失效或账号已删则清掉本地会话
                    try {
                        currentUser = await api('/api/me');
                    } catch (e) {
                        currentUser = null;
                        authToken = '';
                        localStorage.removeItem('currentUser');
                        localStorage.removeItem('token');
                    }
                }
                if (currentUser) {
                    safeSet('currentUser', currentUser);
                    await enterApp();
                }
            }

            // 心跳：防止代理/浏览器掉线断开 WebSocket
            setInterval(() => {
                if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'ping' }));
            }, 30000);
        } catch(e) {
            console.error('初始化失败', e);
            alert('页面初始化异常，请刷新重试');
        }
    });
</script>

</body>
